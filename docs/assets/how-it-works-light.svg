<svg xmlns="http://www.w3.org/2000/svg" width="880" height="334" viewBox="0 0 880 334" role="img" aria-labelledby="t d">
  <title id="t">How Probative verifies a report</title>
  <desc id="d">The control plane reads the probative.toml manifest and never runs the PoC. A build container with no secrets compiles the affected commit with a sanitizer. A run container with no network and a read-only filesystem runs the PoC three times. Only the sanitizer output returns to the oracle, which decides the outcome, and the verdict is signed with Ed25519.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="160" y="14" width="710" height="130" rx="14" fill="#0E7490" fill-opacity="0.06" stroke="#0E7490" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="176" y="38" fill="#0E7490" font-size="11.5" font-weight="700" letter-spacing="1.2">CONTROL PLANE · NEVER RUNS THE POC</text>
  <rect x="160" y="196" width="280" height="130" rx="14" fill="#B45309" fill-opacity="0.06" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="176" y="312" fill="#B45309" font-size="11.5" font-weight="700" letter-spacing="1.2">BUILD CONTAINER · NO SECRETS</text>
  <rect x="520" y="196" width="350" height="130" rx="14" fill="#B91C1C" fill-opacity="0.06" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="536" y="312" fill="#B91C1C" font-size="11.5" font-weight="700" letter-spacing="1.2">RUN CONTAINER · NO NETWORK · READ-ONLY</text>
  <rect x="4" y="62" width="136" height="58" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  <text x="72.0" y="87" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">probative.toml</text>
  <text x="72.0" y="106" text-anchor="middle" fill="#475569" font-size="12">repo · commit · PoC</text>
  <rect x="184" y="62" width="150" height="58" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/>
  <text x="259.0" y="87" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">Orchestrator</text>
  <text x="259.0" y="106" text-anchor="middle" fill="#475569" font-size="12">validate · allowlist</text>
  <rect x="500" y="62" width="180" height="58" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/>
  <text x="590.0" y="87" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">Oracle</text>
  <text x="590.0" y="106" text-anchor="middle" fill="#475569" font-size="12">parse · classify · decide</text>
  <rect x="712" y="62" width="140" height="58" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/>
  <text x="782.0" y="87" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">Signed verdict</text>
  <text x="782.0" y="106" text-anchor="middle" fill="#475569" font-size="12">JCS + Ed25519</text>
  <rect x="176" y="222" width="248" height="58" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="300.0" y="247" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">Build the commit</text>
  <text x="300.0" y="266" text-anchor="middle" fill="#475569" font-size="12">ASan or UBSan · cached by input hash</text>
  <rect x="570" y="222" width="250" height="58" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>
  <text x="695.0" y="247" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">Run the PoC 3×</text>
  <text x="695.0" y="266" text-anchor="middle" fill="#475569" font-size="12">CPU, memory, PID and time limits</text>
  <path d="M140 91 H178" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M259 120 V216" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M424 251 H564" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M600 222 V126" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M680 91 H706" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="268" y="172" text-anchor="start" fill="#475569" font-size="12" font-style="italic">pinned recipe</text>
  <text x="482" y="241" text-anchor="middle" fill="#475569" font-size="12" font-style="italic">image + PoC</text>
  <text x="610" y="172" text-anchor="start" fill="#475569" font-size="12" font-style="italic">sanitizer output only</text>
  </g>
</svg>
