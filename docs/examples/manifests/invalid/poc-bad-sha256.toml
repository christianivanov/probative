# INVALID: sha256 must be 64 lowercase hex characters.
schema_version = "0.1"

[target]
repo_url = "https://github.com/example/libexample"
commit = "0123456789abcdef0123456789abcdef01234567"
fix_commit = "89abcdef0123456789abcdef0123456789abcdef"

[build]
recipe = "oss_fuzz"
sanitizer = "address"
oss_fuzz_project = "libexample"

[poc]
type = "fuzz_input"
file = "poc/crash-1a2b3c"
sha256 = "18889a72"
fuzz_target = "parse_fuzzer"

[claim]
kind = "heap-buffer-overflow"
access = "write"
function = "parse_chunk"
file = "parser.c"
