# INVALID: provenance.found_with must be fuzzing, llm_agent, manual or other.
schema_version = "0.1"

[target]
repo_url = "https://gitlab.example.org/tools/exampletool"
commit = "0123456789abcdef0123456789abcdef01234567"

[build]
recipe = "manual"
sanitizer = "undefined"
manual = "exampletool-cli"

[poc]
type = "cli"
file = "poc/input.bin"
binary = "exampletool"
argv = ["--check", "--input={poc}"]

[claim]
kind = "signed-integer-overflow"
function = "compute_size"

[provenance]
reporter = "Example Reporter"
found_with = "magic"
tool = "example-agent"
model = "example-model"

[extensions.example_tracker]
ticket = "SEC-123"
