# A malicious server PoC: the project's client connects to it over loopback inside the sandbox.
schema_version = "0.1"

[target]
repo_url = "https://github.com/example/httpclient"
commit = "0123456789abcdef0123456789abcdef01234567"
fix_commit = "89abcdef0123456789abcdef0123456789abcdef"

[build]
recipe = "manual"
manual = "httpclient-cli"

[poc]
type = "network"
role = "server"
file = "poc/server.c"
lang = "c"
binary = "httpclient"
argv = ["--fetch", "http://127.0.0.1:{port}/"]

[claim]
kind = "heap-buffer-overflow"
access = "write"
function = "parse_header_line"
